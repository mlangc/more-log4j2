version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      all-dependencies:
        patterns: ["*"]
        # Log4j is handled separately since it's the dependency exported to library users
        exclude-patterns: ["org.apache.logging.log4j:*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
