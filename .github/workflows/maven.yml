# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      test:
        description: 'Test to run, e.g. AsyncHttpAppenderTest#shouldWorkReliablyUnderStress'
        required: false
        default: ''

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up JDK 17
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      env:
        TEST: ${{ inputs.test }}
      run: |
        if [ -n "$TEST" ]; then
          ./mvnw -B -Dtest="$TEST" -Dsurefire.failIfNoSpecifiedTests=false test
        else
          ./mvnw -B package
        fi
    - name: Test Report
      uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
      if: ${{ !cancelled() }}
      with:
        name: JUnit Tests
        path: '**/target/surefire-reports/TEST-*.xml'
        reporter: java-junit