# Reruns tests in a loop on several parallel runners to find (or rule out) rare flakes, using
# scripts/find-flaky-tests.sh. Start it from the Actions tab, or e.g. with:
#
#   gh workflow run find-flaky-tests.yml --ref my-branch -f test='AsyncHttpAppenderTest*' -f module=core
#
# Each job uploads its results file and the Surefire reports of failing iterations; the summary
# job merges the results and fails the run if any test failed.

name: Find flaky tests

on:
  workflow_dispatch:
    inputs:
      test:
        description: 'Maven -Dtest filter, e.g. AsyncHttpAppenderTest*#shouldRespectShutdownMs (empty: all tests)'
        required: false
        default: ''
      module:
        description: 'Maven module (-pl), e.g. core or junit (empty: all modules)'
        required: false
        default: ''
      iterations:
        description: 'Iterations per job'
        required: true
        default: '20'
      shards:
        description: 'Parallel jobs per JDK'
        required: true
        default: '4'
      java-versions:
        description: 'JDK versions as a JSON array'
        required: true
        default: '["17", "21"]'

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
    steps:
    - id: shards
      env:
        SHARDS: ${{ inputs.shards }}
      run: echo "shards=$(seq 1 "$SHARDS" | jq -sc .)" >> "$GITHUB_OUTPUT"

  loop:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: ${{ fromJSON(inputs.java-versions) }}
        shard: ${{ fromJSON(needs.setup.outputs.shards) }}
    name: loop (JDK ${{ matrix.java-version }}, shard ${{ matrix.shard }})
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        cache: maven
    - name: Install xmllint
      run: command -v xmllint || { sudo apt-get update -q && sudo apt-get install -yq libxml2-utils; }
    - name: Run tests in a loop
      env:
        TEST: ${{ inputs.test }}
        MODULE: ${{ inputs.module }}
        ITERATIONS: ${{ inputs.iterations }}
        RESULTS: flaky-results-jdk${{ matrix.java-version }}-shard${{ matrix.shard }}.tsv
      run: |
        args=(--iterations "$ITERATIONS" --output "$RESULTS")
        [ -n "$TEST" ] && args+=(--test "$TEST")
        [ -n "$MODULE" ] && args+=(--module "$MODULE")
        scripts/find-flaky-tests.sh "${args[@]}"
    - name: Upload results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: flaky-results-jdk${{ matrix.java-version }}-shard${{ matrix.shard }}
        path: |
          flaky-results-*.tsv
          target/find-flaky-tests/failures/
        if-no-files-found: ignore

  summary:
    needs: loop
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: flaky-results-*
        path: results
        merge-multiple: true
    - name: Merge results and report
      run: |
        set -o pipefail
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        status=0
        scripts/find-flaky-tests.sh --merge results/flaky-results-*.tsv --output flaky-results-merged.tsv --fail-on-failures \
          | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        if [ "$status" -ne 0 ]; then
          echo "::error::Some tests failed (or the merge failed); see the summary and the uploaded artifacts."
        fi
        exit "$status"
